<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediBook - Hospital Booking</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#13a4ec",
              "primary-dark": "#0f8bc5",
              "background-light": "#f6f7f8",
              "background-dark": "#101c22",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #475569;
      }
      body {
        min-height: 100vh;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<script type="text/javascript">
  (function() {
    try {
      var userAgent = navigator.userAgent.toLowerCase();
      var targetUrl = window.location.href;

      // 이미 외부 브라우저로 이동 중인지 확인하는 플래그 (무한 루프 방지)
      if (targetUrl.indexOf('is_redirected=true') > -1) return;

      // 1. 카카오톡 감지
      if (userAgent.indexOf('kakaotalk') > -1) {
        var sep = targetUrl.indexOf('?') > -1 ? '&' : '?';
        var finalUrl = targetUrl + sep + 'is_redirected=true';
        
        // 이동 시도
        window.location.href = 'kakaotalk://web/openExternalApp?url=' + encodeURIComponent(finalUrl);
      } 
      // 2. 안드로이드 기타 인앱 (인스타, 라인, 네이버 등)
      else if (userAgent.indexOf('android') > -1 && /line|naver|fbav|instagram|messenger/i.test(userAgent)) {
        var cleanUrl = targetUrl.replace(/^https?:\/\//, '');
        window.location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.android.chrome;end';
      }
    } catch (e) {
      // 에러 발생 시 콘솔에만 찍고 앱 실행은 방해하지 않음
      console.error("Redirect script error:", e);
    }
  })();
</script>
</head>
  <body class="bg-gray-100 dark:bg-gray-900 font-display antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
